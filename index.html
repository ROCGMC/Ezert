<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>國軍MDM V-7.61.2</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#000000">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
            transition: background-color 0.3s;
            user-select: none;
        }
        /* 頂部黑列 */
        .header {
            background: #000; color: white; padding: 12px 15px;
            display: flex; justify-content: space-between; font-size: 15px;
            align-items: center; z-index: 100;
        }
        .main {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding-top: 20px; text-align: center;
        }
        .status-msg { font-size: 16px; font-weight: bold; margin-bottom: 30px; }
        /* 模式文字 */
        .mode-title { font-size: 76px; font-weight: 900; margin: 20px 0; color: #000; }
        .mdm-btn {
            background-color: rgba(255, 255, 255, 0.8); border: 1px solid #999;
            padding: 10px 20px; margin: 10px 0; border-radius: 4px;
            width: 240px; font-size: 17px; display: flex; align-items: center;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #333; margin-right: 15px; }
        /* 盾牌圖示：讀取 icon.png */
        .shield-icon { width: 120px; margin-top: 40px; }
        .footer-time { margin-top: auto; padding-bottom: 15px; font-weight: bold; font-size: 17px; }
        /* 下拉選單 */
        #menuPanel {
            position: fixed; top: 45px; right: 10px; background: white;
            border: 1px solid #ccc; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none; z-index: 1000;
        }
        .menu-item { padding: 12px 25px; border-bottom: 1px solid #eee; cursor: pointer; color: black; }
    </style>
</head>
<body id="appBody" style="background-color: #00FF00;">
    <div class="header">
        <span>🛡️ 手機管控系統 MDM V7.11</span>
        <span onclick="toggleMenu()" style="cursor:pointer">系統選單 ▾</span>
    </div>
    <div id="menuPanel">
        <div class="menu-item" onclick="changeState('green')">任務模式 (綠)</div>
        <div class="menu-item" onclick="changeState('yellow')">解鎖中 (黃)</div>
        <div class="menu-item" onclick="changeState('red')">未上鎖 (紅)</div>
    </div>
    <div class="main">
        <div id="statusMsg" class="status-msg">已上鎖，可進入管制區</div>
        <div id="modeTitle" class="mode-title">任務模式</div>
        <div class="btn-group">
            <div class="mdm-btn"><div class="dot" style="background: #00FF00;"></div>上鎖:進入管制模式</div>
            <div class="mdm-btn"><div class="dot" style="background: #FF0000;"></div>解鎖:離開管制模式</div>
        </div>
        <img src="icon.png" class="shield-icon">
        <div id="clock" class="footer-time">----/--/-- --:--:--</div>
    </div>
    <script>
        const states = {
            green: { bg: '#00FF00', msg: '已上鎖，可進入管制區', title: '任務模式' },
            yellow: { bg: '#FFFF00', msg: '解鎖中,尚無定位資訊..', title: '解鎖中' },
            red: { bg: '#FF0000', msg: '未上鎖，不得進入管制園區', title: '未上鎖' }
        };
        function toggleMenu() {
            const menu = document.getElementById('menuPanel');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }
        function changeState(type) {
            const data = states[type];
            document.getElementById('appBody').style.backgroundColor = data.bg;
            document.getElementById('statusMsg').innerText = data.msg;
            document.getElementById('modeTitle').innerText = data.title;
            toggleMenu();
        }
        function updateClock() {
            const now = new Date();
            const Y = now.getFullYear();
            const M = String(now.getMonth() + 1).padStart(2, '0');
            const D = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${Y}-${M}-${D} ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
    </script>
</body>
</html>
