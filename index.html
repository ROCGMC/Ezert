<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezert MDM</title>
    <link rel="manifest" href="/Ezert/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/Ezert/icon.png">
</head>
<body>
    <div style="text-align:center; padding-top:50px;">
        <h1>Ezert 系統</h1>
        <p id="sw-status">Service Worker 檢查中...</p>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 註冊時也指定 Scope
                navigator.serviceWorker.register('/Ezert/sw.js', { scope: '/Ezert/' })
                    .then(reg => {
                        console.log('註冊成功');
                        document.getElementById('sw-status').innerText = "PWA 已就緒 (已連線)";
                    })
                    .catch(err => {
                        document.getElementById('sw-status').innerText = "註冊失敗: " + err;
                    });
            });
        }
    </script>
</body>
</html>
