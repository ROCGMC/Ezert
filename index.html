<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDM App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #333;
        }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: #ccc;
        }
        .online { background: #4CAF50; }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <img src="icon.png" alt="Logo" style="width: 100px; border-radius: 20px; margin-bottom: 20px;">
        <h1>MDM 系統</h1>
        <p>狀態: <span id="statusText">正在檢查...</span> <span id="dot" class="status-dot"></span></p>
    </div>

    <script>
        // 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('SW 註冊成功');
                        document.getElementById('statusText').innerText = '已就緒 (PWA)';
                        document.getElementById('dot').classList.add('online');
                    })
                    .catch(err => {
                        document.getElementById('statusText').innerText = '註冊失敗';
                    });
            });
        }
    </script>
</body>
</html>
