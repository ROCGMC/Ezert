<!doctype html>
<html lang="zh-TW" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="資產管理">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/zh/2/24/ROC_National_Security_Bureau_Seal.svg">
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/zh/2/24/ROC_National_Security_Bureau_Seal.svg">
  <title>國家安全局情報回覆系統</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&amp;family=Orbitron:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', sans-serif; }
    .font-digital { font-family: 'Orbitron', monospace; }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); } 50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.6); } }
    .scanline { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(to bottom, transparent, rgba(34, 197, 94, 0.1), transparent); animation: scanline 3s linear infinite; pointer-events: none; z-index: 100; }
    .pulse-border { animation: pulse-glow 2s ease-in-out infinite; }
    .glass-dark { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(34, 197, 94, 0.2); }
    .btn-classified { background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%); border: 1px solid #22c55e; transition: all 0.3s ease; }
    .btn-classified:hover { background: #22c55e; color: #000; }
    input:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
    body, html { -webkit-user-select: none; -webkit-touch-callout: none; overflow-x: hidden; }
  </style>
 </head>
 <body class="h-full bg-black text-green-500 overflow-auto">
  <div class="scanline"></div>

  <div id="auth-screen" class="h-full flex flex-col items-center justify-center p-6">
   <div class="glass-dark rounded-lg p-8 max-w-md w-full text-center">
    <div class="mb-6">
     <img src="https://upload.wikimedia.org/wikipedia/zh/2/24/ROC_National_Security_Bureau_Seal.svg" alt="NSB" class="w-24 h-24 mx-auto mb-4 opacity-90">
     <h1 class="text-xl font-bold text-green-400 tracking-wider">國家安全局</h1>
     <p class="text-sm text-green-600 mt-1">NATIONAL SECURITY BUREAU</p>
    </div>
    <div class="border-t border-green-900 my-6"></div>
    <div class="mb-6">
     <p class="text-xs text-yellow-500 mb-4">⚠ 授權存取終端已啟動</p>
     <input type="password" id="auth-code" class="w-full bg-black border border-green-800 rounded px-4 py-3 text-green-400 font-digital tracking-widest text-center" placeholder="ENTER CODE" maxlength="6">
    </div>
    <button id="auth-btn" class="btn-classified w-full py-3 rounded text-green-400 font-medium"> 身份驗證 </button>
   </div>
  </div>

  <div id="main-app" class="h-full flex flex-col hidden">
   <header class="glass-dark p-4 flex items-center justify-between sticky top-0 z-40">
    <div>
     <h1 class="text-lg font-bold text-green-400">資產管理系統</h1>
     <p class="text-xs text-green-700">ASSET MANAGEMENT</p>
    </div>
    <button id="logout-btn" class="text-red-500 text-sm border border-red-800 px-3 py-1 rounded">登出</button>
   </header>

   <div class="p-4">
    <div class="glass-dark rounded-lg p-6 pulse-border">
     <p class="text-xs text-green-600 mb-1">總資產餘額</p>
     <p id="total-balance" class="text-3xl font-digital font-bold text-green-400">NT$ 0</p>
    </div>
   </div>

   <div class="px-4 flex gap-2">
    <button id="tab-wallet" class="flex-1 py-2 rounded bg-green-900 text-green-400 text-sm">錢包一覽</button>
    <button id="tab-deposit" class="flex-1 py-2 rounded border border-green-800 text-green-600 text-sm">存入資產</button>
   </div>

   <div id="wallet-view" class="flex-1 p-4 overflow-auto">
    <div id="wallet-list" class="space-y-3"></div>
    <div id="empty-state" class="text-center py-12 text-green-800 hidden">暫無資產記錄</div>
   </div>

   <div id="deposit-view" class="flex-1 p-4 overflow-auto hidden">
    <div class="glass-dark rounded-lg p-6 space-y-4">
      <select id="denomination" class="w-full bg-black border border-green-800 rounded px-4 py-3 text-green-400">
        <option value="1000">NT$ 1,000</option>
        <option value="500">NT$ 500</option>
        <option value="100">NT$ 100</option>
      </select>
      <input type="text" id="notes" class="w-full bg-black border border-green-800 rounded px-4 py-3 text-green-400" placeholder="備註內容">
      <button id="deposit-btn" class="btn-classified w-full py-3 rounded text-green-400">確認存入</button>
    </div>
   </div>
  </div>

  <script>
    let walletData = [];
    
    // 初始化與驗證
    function setup() {
      document.getElementById('auth-btn').onclick = () => {
        const code = document.getElementById('auth-code').value;
        if(code.length >= 4) {
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('main-app').classList.remove('hidden');
        }
      };
      
      document.getElementById('logout-btn').onclick = () => location.reload();
      
      document.getElementById('tab-wallet').onclick = () => {
        document.getElementById('wallet-view').classList.remove('hidden');
        document.getElementById('deposit-view').classList.add('hidden');
      };
      
      document.getElementById('tab-deposit').onclick = () => {
        document.getElementById('deposit-view').classList.remove('hidden');
        document.getElementById('wallet-view').classList.add('hidden');
      };

      document.getElementById('deposit-btn').onclick = deposit;
    }

    async function deposit() {
      const amount = parseInt(document.getElementById('denomination').value);
      const note = document.getElementById('notes').value;
      const record = { id: Date.now(), denomination: amount, notes: note, deposit_time: new Date().toISOString() };
      
      walletData.push(record);
      render();
      document.getElementById('notes').value = '';
      alert('資產已加密存入');
    }

    function render() {
      const list = document.getElementById('wallet-list');
      list.innerHTML = walletData.map(item => `
        <div class="glass-dark rounded-lg p-4">
          <p class="font-digital text-green-400">NT$ ${item.denomination}</p>
          <p class="text-xs text-green-700">${item.notes || '無備註'}</p>
        </div>
      `).join('');
      
      const total = walletData.reduce((sum, i) => sum + i.denomination, 0);
      document.getElementById('total-balance').textContent = `NT$ ${total.toLocaleString()}`;
    }

    // PWA Service Worker 註冊 (安裝 App 的關鍵)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob));
      });
    }

    setup();
  </script>
 </body>
</html>
